apiVersion: apps/v1
kind: Deployment
metadata:
  name: litdemo
  namespace: default
  labels:
    app: litdemo
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: litdemo
  template:
    metadata:
      labels:
        app: litdemo
    spec:
      imagePullSecrets:
        - name: regcred2
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: litdemo
          # builddocker.sh replaces this placeholder before applying the manifest.
          image: docker.3dpack.ing/litdemo:deploy
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: litdemo
  namespace: default
  labels:
    app: litdemo
spec:
  selector:
    app: litdemo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litdemo
  namespace: default
  labels:
    app: litdemo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [litdemo.novian.works]
      secretName: litdemo-tls
  rules:
    - host: litdemo.novian.works
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: litdemo
                port:
                  number: 80
